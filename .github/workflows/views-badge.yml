name: Generate Profile Views Badge

on:
  schedule:
    - cron: "0 */6 * * *"  # every 6 hours
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch traffic data
        run: |
          curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository_owner }}/${{ github.repository_owner }}/traffic/views > traffic.json
          cat traffic.json

      - name: Generate SVG badge
        run: |
          mkdir -p dist
          python3 << 'PYEOF'
          import json
          with open('traffic.json') as f:
              data = json.load(f)
          total = sum(d['uniques'] for d in data.get('views', []))
          total_str = str(total)
          # calculate svg width
          label_w = 75
          num_w = max(45, 8 * len(total_str) + 20)
          total_w = label_w + num_w
          
          svg = f'''<svg xmlns="http://www.w3.org/2000/svg" width="{total_w}" height="20">
            <linearGradient id="b" x2="0" y2="100%">
              <stop offset="0" stop-color="#bbb" stop-opacity=".1"/>
              <stop offset="1" stop-opacity=".1"/>
            </linearGradient>
            <clipPath id="a">
              <rect width="{total_w}" height="20" rx="3" fill="#fff"/>
            </clipPath>
            <g clip-path="url(#a)">
              <path fill="#555" d="M0 0h{label_w}v20H0z"/>
              <path fill="#36BCF7" d="M{label_w} 0h{num_w}v20H{label_w}z"/>
              <path fill="url(#b)" d="M0 0h{total_w}v20H0z"/>
            </g>
            <g fill="#fff" text-anchor="middle" font-family="DejaVu Sans,Verdana,Geneva,sans-serif" font-size="11">
              <text x="{label_w/2}" y="15" fill="#010101" fill-opacity=".3">Profile Views</text>
              <text x="{label_w/2}" y="14">Profile Views</text>
              <text x="{label_w + num_w/2}" y="15" fill="#010101" fill-opacity=".3">{total}</text>
              <text x="{label_w + num_w/2}" y="14">{total}</text>
            </g>
          </svg>'''
          
          with open('dist/profile-views.svg', 'w') as f:
              f.write(svg)
          print(f"Generated badge with {total} views")
          PYEOF

      - name: Deploy to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
